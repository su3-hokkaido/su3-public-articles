<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" style="font-family:'Helvetica Neue',Arial,'Hiragino Sans',sans-serif;background:#fff">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#fff"/>

  <!-- user -->
  <rect x="30" y="150" width="170" height="80" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="115" y="180" text-anchor="middle" fill="#2C2C2A" font-size="15" font-weight="500">利用者</text>
  <text x="115" y="206" text-anchor="middle" fill="#5F5E5A" font-size="12">「AIが全部教えてくれるよ」</text>

  <line x1="200" y1="190" x2="238" y2="190" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AI -->
  <rect x="240" y="150" width="220" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="350" y="180" text-anchor="middle" fill="#0C447C" font-size="15" font-weight="500">AI</text>
  <text x="350" y="206" text-anchor="middle" fill="#185FA5" font-size="13">それらしい自然な文章で回答</text>

  <!-- branches -->
  <path d="M460 190 H490 V90 H518" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 190 V290 H518" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- NG -->
  <rect x="520" y="35" width="410" height="110" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="725" y="70" text-anchor="middle" fill="#791F1F" font-size="17" font-weight="500">NG：全部正しいと信じる</text>
  <text x="725" y="98" text-anchor="middle" fill="#A32D2D" font-size="13">根拠が曖昧なまま自信を持って答えることがある</text>
  <text x="725" y="122" text-anchor="middle" fill="#A32D2D" font-size="13">（ハルシネーション）</text>

  <!-- OK -->
  <rect x="520" y="185" width="410" height="205" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="725" y="220" text-anchor="middle" fill="#27500A" font-size="17" font-weight="500">OK：裏取りをする</text>
  <rect x="545" y="240" width="360" height="38" rx="8" fill="#fff" stroke="#97C459" stroke-width="1"/>
  <text x="725" y="264" text-anchor="middle" fill="#27500A" font-size="14">複数の情報源で確認する</text>
  <rect x="545" y="288" width="360" height="38" rx="8" fill="#fff" stroke="#97C459" stroke-width="1"/>
  <text x="725" y="312" text-anchor="middle" fill="#27500A" font-size="14">回答の根拠・出典をAIに尋ねる</text>
  <rect x="545" y="336" width="360" height="38" rx="8" fill="#fff" stroke="#97C459" stroke-width="1"/>
  <text x="725" y="360" text-anchor="middle" fill="#27500A" font-size="14">医療・法律などは専門家・公的機関にも確認</text>
</svg>
