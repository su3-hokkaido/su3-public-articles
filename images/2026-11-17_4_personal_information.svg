<svg width="960" height="400" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" style="font-family:'Helvetica Neue',Arial,'Hiragino Sans',sans-serif;background:#fff">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#fff"/>

  <!-- row 1 -->
  <rect x="40" y="40" width="200" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="140" y="70" text-anchor="middle" fill="#2C2C2A" font-size="14" font-weight="500">名前・住所など</text>
  <text x="140" y="92" text-anchor="middle" fill="#5F5E5A" font-size="12">個人情報</text>
  <line x1="240" y1="75" x2="288" y2="75" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="40" width="280" height="70" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="430" y="82" text-anchor="middle" fill="#633806" font-size="14">目的がよく分からないサイトに入力</text>
  <line x1="570" y1="75" x2="618" y2="75" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="620" y="40" width="300" height="70" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="770" y="82" text-anchor="middle" fill="#791F1F" font-size="14">情報の行き先・使い道が分からない</text>

  <line x1="40" y1="145" x2="920" y2="145" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- row 2 -->
  <rect x="40" y="190" width="200" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="140" y="220" text-anchor="middle" fill="#2C2C2A" font-size="14" font-weight="500">Word ファイル</text>
  <text x="140" y="242" text-anchor="middle" fill="#5F5E5A" font-size="12">に個人情報を書いている</text>
  <line x1="240" y1="225" x2="268" y2="225" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="605" y="180" text-anchor="middle" fill="#2C2C2A" font-size="14" font-weight="500">OneDrive などの「共有リンク」の設定</text>
  <rect x="270" y="195" width="180" height="60" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="360" y="231" text-anchor="middle" fill="#27500A" font-size="14">自分だけ</text>
  <rect x="460" y="195" width="180" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="550" y="231" text-anchor="middle" fill="#633806" font-size="14">特定の人だけ</text>
  <rect x="650" y="195" width="270" height="60" rx="10" fill="#A32D2D"/>
  <text x="785" y="231" text-anchor="middle" fill="#fff" font-size="15" font-weight="500">リンクを知っている全員</text>

  <line x1="280" y1="285" x2="910" y2="285" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="306" fill="#3B6D11" font-size="12">安全</text>
  <text x="910" y="306" text-anchor="end" fill="#A32D2D" font-size="12">危険</text>

  <text x="785" y="345" text-anchor="middle" fill="#791F1F" font-size="13">リンクさえ分かれば誰でもアクセスできる状態</text>
  <text x="785" y="366" text-anchor="middle" fill="#791F1F" font-size="13">（実際にあった「ヒヤッとした」ケース）</text>
</svg>
